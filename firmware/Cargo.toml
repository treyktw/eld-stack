[package]
name = "eld-firmware"
version = "0.1.0"
authors = ["Trey Murray"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "eld-firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
# BLE is part of the normal T-SIM7670G-S3 firmware image. Keeping this as an
# explicit Cargo feature makes the active implementation visible to
# rust-analyzer as well as rustc. ESP-IDF's sdkconfig still has to provide the
# Bluetooth controller and Bluedroid component, or this feature fails to build.
default = ["bluetooth"]
bluetooth = []

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "eaf69b2ae2a3b0816346c51ea326634b5d3dc88b" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git", rev = "24e99b865a0ffc87dcb4f4142fb06daeb9481c89" }
# Includes esp-rs/esp-idf-svc#670: ESP-IDF 5.5 otherwise initializes the
# ESP32-S3 controller with BLE advertising disabled (HCI status 0x0c).
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git", rev = "ae3aba80105bb2a22fe39fe60442e591b37a52fb" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
anyhow = "1.0.102"
# Fixed-capacity collections (no heap alloc) for bus profiles, PGN registry, queues.
heapless = "0.8"
enumset = "1.1"
# Firmware image signature verification. Pure Rust rather than ESP-IDF's
# mbedtls, whose builds do not reliably enable Ed25519.
ed25519-dalek = { version = "2", default-features = false }

[build-dependencies]
embuild = "0.33"
