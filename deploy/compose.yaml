# Local end-to-end stack: Postgres + ingest-server + a webhook sink standing in
# for the downstream pipeline. Every value is interpolated from the
# environment; the defaults below are DEMO values for `scripts/replay.sh` and
# must be overridden (copy deploy/.env.example to deploy/.env) anywhere real.
name: j1939-eld

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eld_ingest
      POSTGRES_USER: eld_ingest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eld-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on loopback only, for `scripts/replay.sh --host-server`.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eld_ingest -d eld_ingest"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  ingest:
    # Skipped by `scripts/replay.sh --host-server`, which runs the binary on
    # the host instead (useful where image builds cannot reach the network).
    profiles: ["server"]
    build:
      context: ../ingest-server
      dockerfile: Dockerfile
    image: j1939-eld/ingest-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eld_ingest:${POSTGRES_PASSWORD:-eld-demo-password}@postgres:5432/eld_ingest}
      BIND_ADDR: 0.0.0.0:8080
      INGEST_DEVICE_TOKENS_JSON: ${INGEST_DEVICE_TOKENS_JSON:-{"eld-demo-001":"demo-token-device-001-FAKEFAKEFAKEFAKE","eld-demo-002":"demo-token-device-002-FAKEFAKEFAKEFAKE"}}
      PIPELINE_URL: ${PIPELINE_URL:-http://webhook-sink:9000/events}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-demo-pipeline-token-FAKEFAKEFAKEFAKEFAKE}
      RUST_LOG: ${RUST_LOG:-info,eld_ingest_server=debug}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:${INGEST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Stand-in for the downstream pipeline: accepts the outbox's POSTs, checks
  # the bearer token, and counts received vs unique event_ids.
  webhook-sink:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/webhook-sink.py"]
    environment:
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-demo-pipeline-token-FAKEFAKEFAKEFAKEFAKE}
    volumes:
      - ../scripts/webhook-sink.py:/app/webhook-sink.py:ro
    ports:
      - "127.0.0.1:${SINK_PORT:-9000}:9000"

volumes:
  postgres_data:
